<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="RepuestosPRO — Gestión inteligente de pedidos y repuestos para talleres técnicos" />
  <meta name="theme-color" content="#1A1916" />

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RepuestosPRO" />

  <!-- Favicon SVG inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231A1916'/><text y='24' x='4' font-size='22'>🔩</text></svg>" />

  <!-- Google Fonts — preconnect primero, luego cargar -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <title>RepuestosPRO</title>

  <style>
    /* Reset y base global */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 14px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F7F6F3;
      color: #1A1916;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    /* Scrollbar global */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D3CFC6; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #9C9A92; }

    /* Loader inicial (mientras carga React) */
    #initial-loader {
      position: fixed;
      inset: 0;
      background: #F7F6F3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      transition: opacity .3s;
    }

    #initial-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo {
      width: 56px;
      height: 56px;
      background: #1A1916;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .loader-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #1A1916;
    }

    .loader-sub {
      font-size: 13px;
      color: #9C9A92;
      margin-top: -10px;
    }

    .loader-bar {
      width: 140px;
      height: 3px;
      background: #E2DFD8;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }

    .loader-bar-fill {
      height: 100%;
      background: #1A1916;
      border-radius: 99px;
      animation: loadBar 1.2s ease-in-out forwards;
    }

    @keyframes loadBar {
      from { width: 0%; }
      to   { width: 100%; }
    }

    /* Keyframes globales usados en módulos */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { transform: translateX(40px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Mobile-first responsive helpers */
    @media (max-width: 768px) {
      .sidebar-wrap { display: none !important; }

      /* Mejor táctil en móvil */
      button, select, input {
        min-height: 40px;
      }
    }

    /* Safe area para iPhone con notch */
    @supports (padding: env(safe-area-inset-bottom)) {
      body {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }

    /* Print */
    @media print {
      .no-print { display: none !important; }
      body       { background: #fff !important; }
    }
  </style>
</head>

<body>
  <!-- Loader inicial -->
  <div id="initial-loader">
    <div class="loader-logo">🔩</div>
    <div class="loader-name">RepuestosPRO</div>
    <div class="loader-sub">Cargando el sistema…</div>
    <div class="loader-bar">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <!-- Punto de montaje de React -->
  <div id="root"></div>

  <!-- Ocultar loader cuando React esté listo -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const loader = document.getElementById('initial-loader');
        if (loader) loader.classList.add('hidden');
        setTimeout(() => { if (loader) loader.remove(); }, 400);
      }, 1400);
    });
  </script>

  <!-- Entry point de Vite -->
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
